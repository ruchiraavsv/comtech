# Run as a separate project: podman compose -p comtech-tests -f compose.test.yaml ...
services:
  postgres:
    image: docker.io/library/postgres:16.10-bookworm
    environment:
      POSTGRES_USER: comtech
      POSTGRES_PASSWORD: test-only
      POSTGRES_DB: comtech_test
    tmpfs: [/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U comtech -d comtech_test"]
      interval: 2s
      timeout: 3s
      retries: 30
  tests:
    build:
      context: .
      target: test
    environment:
      TEST_DATABASE_URL: postgresql://comtech:test-only@postgres:5432/comtech_test
      LANGSMITH_TRACING: "false"
    depends_on:
      postgres:
        condition: service_healthy
