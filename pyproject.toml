[project]
name = "comtech-assistant"
version = "0.1.0"
description = "Observable async assistant infrastructure"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
  "sse-starlette>=2.2,<4",
  "langgraph>=1.0,<2",
  "langgraph-checkpoint-postgres>=3,<4",
  "langsmith>=0.4,<1",
  "ag-ui-protocol>=0.1,<1",
  "psycopg[binary,pool]>=3.2,<4",
  "pydantic-settings>=2.7,<3",
  "httpx>=0.28,<1",
  "pinecone[asyncio]>=6,<9",
  "openai>=2,<3",
]

[dependency-groups]
ui = ["streamlit>=1.45,<2", "httpx-sse>=0.4,<1"]
dev = ["pytest>=8,<10", "pytest-asyncio>=1,<2", "ruff>=0.11,<1", "httpx-sse>=0.4,<1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/comtech"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["integration: requires isolated Postgres", "hosted: opt-in external credentials"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
