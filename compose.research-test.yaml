# Add to compose.test.yaml + compose.runner-test.yaml; synthetic readiness only, no paid calls.
services:
  broker-fixtures:
    image: comtech-runner-tests-tests
    profiles: [initialize]
    environment:
      PYTHONPATH: /app/src
      TEST_DATABASE_URL: postgresql://comtech:test-only@postgres:5432/comtech_test
    volumes:
      - ./tests:/app/tests:ro
      - ./src:/app/src:ro
      - research-sources:/fixtures
      - research-artifacts:/artifacts
    command: [/app/.venv/bin/python, -m, tests.research.package_fixture]
  research-broker:
    build:
      context: .
      target: research-broker
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: [/tmp]
    environment:
      DATABASE_URL: postgresql://comtech:test-only@postgres:5432/comtech_test
      PINECONE_API_KEY: synthetic-not-a-provider-key
      AGENT_BUILD_ID: 1234567890abcdef
      INGESTION_ARTIFACT_ROOT: /fixtures
      RESEARCH_SERVICE_TOKEN: synthetic-private-service-token-32-characters
    volumes:
      - research-sources:/fixtures:ro
      - research-artifacts:/var/research/artifacts
      - research-control:/run/research-control
    healthcheck:
      test: [CMD, python, -c, "import os,urllib.request; r=urllib.request.Request('http://localhost:8002/health/ready',headers={'Authorization':'Bearer '+os.environ['RESEARCH_SERVICE_TOKEN']}); urllib.request.urlopen(r,timeout=3)"]
      interval: 3s
      timeout: 4s
      retries: 12
volumes:
  research-sources:
  research-artifacts:
