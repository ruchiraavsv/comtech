name: comtech
services:
  postgres:
    image: docker.io/library/postgres:16.10-bookworm
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Copy .env.example to .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-comtech}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 3s
      retries: 20
  migrate:
    build:
      context: .
      target: api
    env_file: ${APP_ENV_FILE:-.env}
    command: [python, -m, comtech.migrate]
    depends_on:
      postgres:
        condition: service_healthy
  api:
    build:
      context: .
      target: api
    env_file: ${APP_ENV_FILE:-.env}
    environment:
      PORT: "8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    stop_grace_period: 20s
  ui:
    build:
      context: .
      target: ui
    environment:
      API_BASE_URL: http://api:8000
      PORT: "8501"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8501/_stcore/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 6
  pinecone-local:
    image: ghcr.io/pinecone-io/pinecone-index:latest
    platform: linux/amd64
    profiles: [vector-test]
    environment:
      PORT: "5081"
      INDEX_TYPE: serverless
      VECTOR_TYPE: dense
      DIMENSION: "3"
      METRIC: cosine
  vector-test:
    build:
      context: .
      target: api
    profiles: [vector-test]
    environment:
      PINECONE_MODE: local
      PINECONE_LOCAL_HOST: http://pinecone-local:5081
    command: [python, -m, comtech.integrations.smoke, pinecone-local]
    depends_on:
      - pinecone-local
volumes:
  postgres-data:
